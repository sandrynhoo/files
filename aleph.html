<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aleph Inc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f0eee9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
    }

    .logo {
      display: flex;
      align-items: baseline;
      gap: .6rem;
      font-family: 'Bodoni Moda', serif;
      font-weight: 900;
      color: #000;
      user-select: none;
    }

    .logo-symbol { font-size: 5rem; line-height: 1; }
    .logo-name   { font-size: 2.2rem; letter-spacing: .12em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="logo">
    <span class="logo-symbol">א</span>
    <span class="logo-name">Aleph</span>
  </div>
</body>
</html>
